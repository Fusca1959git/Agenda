```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="../Logo.png">

    <title>Cadastrar | VidaCare</title>
</head>

<body>

    <main class="auth-page">

        <section class="auth-info">

            <a href="../index.html" class="auth-logo">
                <img src="../Logo.png" alt="VidaCare">
                <strong>VidaCare</strong>
            </a>

            <div>
                <span>VIDACARE</span>

                <h1>
                    Comece a cuidar
                    melhor de você.
                </h1>

                <p>
                    Crie sua conta e tenha acesso aos nossos serviços
                    de forma rápida e segura.
                </p>
            </div>

        </section>


        <section class="auth-form">

            <div class="form-header">

                <h2>Crie sua conta</h2>

                <p>
                    Preencha seus dados para começar.
                </p>

            </div>


            <form>

                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="field">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        inputmode="numeric"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="field">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo 6 caracteres"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Repita sua senha"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <button type="submit">
                    Criar minha conta
                </button>

            </form>


            <p class="account-link">

                Já possui uma conta?

                <a href="entrar.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>

</body>

</html>
```
