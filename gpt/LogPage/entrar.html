<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="../Logo.png">

    <title>Entrar | VidaCare</title>
</head>

<body>

    <main class="auth-page">

        <section class="auth-info">

            <a href="../index.html" class="auth-logo">
                <img src="../Logo.png" alt="VidaCare">
                <strong>VidaCare</strong>
            </a>

            <div>
                <span>VIDACARE</span>

                <h1>
                    Cuidar da sua saúde
                    começa aqui.
                </h1>

                <p>
                    Acesse sua conta para acompanhar suas consultas
                    e utilizar nossos serviços.
                </p>
            </div>

        </section>


        <section class="auth-form">

            <div class="form-header">

                <h2>Bem-vindo de volta!</h2>

                <p>
                    Entre com seus dados para continuar.
                </p>

            </div>


            <form>

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="field">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p class="account-link">
                Ainda não possui uma conta?
                <a href="cadastrar.html">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

</body>

</html>
